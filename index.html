<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visual Notes Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Kalam:wght@300;400;700&family=Patrick+Hand&family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- FORMULA BUILDER MODAL DIALOG -->
  <div id="formulaModal">
    <div class="formula-card-dialog">
      <div class="formula-dialog-header">
        <span>Insert Formula</span>
        <button class="control-btn" onclick="closeFormulaModal()">✕</button>
      </div>
      <div class="formula-type-tabs">
        <button class="formula-tab-btn active" id="tabBasic" onclick="switchFormulaTab('basic')">Standard Equation</button>
        <button class="formula-tab-btn" id="tabFraction" onclick="switchFormulaTab('fraction')">Fraction / Ratio</button>
      </div>

      <div id="paneBasic">
        <div class="formula-input-row">
          <label>Equation Text:</label>
          <input type="text" id="basicFormulaInput" class="formula-text-input" placeholder="e.g. GNP = GDP + NFIA">
        </div>
      </div>

      <div id="paneFraction" style="display: none;">
        <div class="formula-input-row">
          <label>Left Title / Prefix:</label>
          <input type="text" id="fractionTitleInput" class="formula-text-input" placeholder="e.g. Ratio =">
        </div>
        <div class="formula-input-row">
          <label>Numerator (Top):</label>
          <input type="text" id="fractionNumInput" class="formula-text-input" placeholder="e.g. Nominal Value">
        </div>
        <div class="formula-input-row">
          <label>Denominator (Bottom):</label>
          <input type="text" id="fractionDenInput" class="formula-text-input" placeholder="e.g. Real Value">
        </div>
        <div class="formula-input-row">
          <label>Multiplier / Suffix:</label>
          <input type="text" id="fractionSuffixInput" class="formula-text-input" placeholder="e.g. × 100">
        </div>
      </div>

      <div class="formula-modal-actions">
        <button class="action-btn" style="background:#475569; color:#fff;" onclick="closeFormulaModal()">Cancel</button>
        <button class="action-btn" style="background:#2563eb; color:#fff;" onclick="commitFormulaInsertion()">Insert Formula</button>
      </div>
    </div>
  </div>

  <div class="app-viewport">
    <!-- LEFT TOOLBOX -->
    <aside class="toolbox">
      <div class="toolbox-header">
        <h2>Notes Element Studio</h2>
        <div class="doc-meta-box">
          <label class="doc-meta-label">Active Note Title</label>
          <input type="text" id="docTitleInput" class="doc-meta-input" value="Notes Visual Builder" oninput="syncManualTitle(this.value)">
        </div>
      </div>
      
      <div class="toolbox-items">
        <div class="tool-group-title">Media &amp; Diagrams</div>
        <input type="file" id="directCanvasImageInput" accept="image/*,.svg" style="display: none;" onchange="handleDirectCanvasImage(event)">
        <button class="tool-btn btn-accent" onclick="document.getElementById('directCanvasImageInput').click()">🖼️ Upload &amp; Insert Image</button>

        <div class="tool-group-title">Text Highlighter</div>
        <div class="sidebar-highlighter-row">
          <button class="hl-palette-btn" style="background:#fef08a;" title="Yellow" onmousedown="handleHighlightClick(event, 'hl-yellow')"></button>
          <button class="hl-palette-btn" style="background:#bbf7d0;" title="Green" onmousedown="handleHighlightClick(event, 'hl-green')"></button>
          <button class="hl-palette-btn" style="background:#fbcfe8;" title="Pink" onmousedown="handleHighlightClick(event, 'hl-pink')"></button>
          <button class="hl-palette-btn" style="background:#bae6fd;" title="Blue" onmousedown="handleHighlightClick(event, 'hl-blue')"></button>
          <button class="hl-palette-btn" style="background:#fed7aa;" title="Orange" onmousedown="handleHighlightClick(event, 'hl-orange')"></button>
          <button class="hl-palette-btn" style="background:#e9d5ff;" title="Purple" onmousedown="handleHighlightClick(event, 'hl-purple')"></button>
          <button class="hl-palette-btn" style="background:#99f6e4;" title="Teal" onmousedown="handleHighlightClick(event, 'hl-teal')"></button>
          <button class="hl-palette-btn" style="background:#fde68a;" title="Amber" onmousedown="handleHighlightClick(event, 'hl-amber')"></button>
          <button class="hl-palette-btn hl-clear-btn" title="Clear Highlight" onmousedown="handleClearHighlightClick(event)">✕</button>
        </div>

        <div class="tool-group-title">Text Size Sizer</div>
        <div class="sidebar-highlighter-row">
          <button class="text-size-btn" title="Small Text" onmousedown="handleTextSizeClick(event, 'fs-sm')">S</button>
          <button class="text-size-btn" title="Medium Text" onmousedown="handleTextSizeClick(event, 'fs-md')">M</button>
          <button class="text-size-btn" title="Large Text" onmousedown="handleTextSizeClick(event, 'fs-lg')">L</button>
          <button class="text-size-btn" title="Extra Large Text" onmousedown="handleTextSizeClick(event, 'fs-xl')">XL</button>
          <button class="text-size-btn text-size-clear" title="Reset Text Size" onmousedown="handleClearTextSizeClick(event)">✕</button>
        </div>

        <div class="tool-group-title">Layout &amp; Structure</div>
        <button class="tool-btn" onclick="insertBlock('banner')">🏷️ Blank Title Banner</button>
        <button class="tool-btn" onclick="insertBlock('header')">📌 Section Header</button>
        <button class="tool-btn" onclick="insertBlock('grid-2')">🔲 Blank 2-Column Side-by-Side</button>
        <button class="tool-btn" onclick="insertBlock('table-blank')">📊 Blank Comparison Table</button>
        <button class="tool-btn" onclick="openFormulaModalForCursor()">∑ Math / Formula Block</button>

        <div class="tool-group-title">Thematic Single Cards</div>
        <button class="tool-btn" onclick="insertBlock('card-blue')">📘 Blank Card (Blue)</button>
        <button class="tool-btn" onclick="insertBlock('card-green')">📗 Blank Card (Green)</button>
        <button class="tool-btn" onclick="insertBlock('card-yellow')">📒 Blank Card (Yellow)</button>
        <button class="tool-btn" onclick="insertBlock('card-purple')">🔮 Blank Card (Purple)</button>

        <div class="tool-group-title">High-Yield Exam Elements</div>
        <button class="tool-btn" onclick="insertBlock('sticky-yellow')">📌 Sticky Note (Yellow)</button>
        <button class="tool-btn" onclick="insertBlock('sticky-pink')">📌 Sticky Note (Pink)</button>
        <button class="tool-btn" onclick="insertBlock('exam-trap')">⚡ Blank Exam Trap Box</button>
        <button class="tool-btn" onclick="insertBlock('mcq-dropdown')">❓ Blank Prelims MCQ (Dropdown)</button>

        <div class="tool-group-title">Mains Engine</div>
        <button class="tool-btn" onclick="insertMainsQuestion()">✍️ Add Mains Question</button>
      </div>

      <input type="file" id="htmlFileInput" accept=".html,.htm" style="display: none;" onchange="handleFileSelect(event)">

      <div class="actions-panel">
        <button class="action-btn btn-import" onclick="document.getElementById('htmlFileInput').click()">📂 Open &amp; Edit HTML File</button>
        <button class="action-btn btn-export" onclick="exportCleanHTML()">💾 Download Clean HTML</button>
        <button class="action-btn btn-print" onclick="window.print()">🖨️ Print / Save as PDF</button>
        <button class="action-btn btn-clear" onclick="clearCanvas()">🗑️ Clear Canvas</button>
      </div>
    </aside>

    <!-- WORKSPACE CANVAS -->
    <main class="canvas-wrapper" id="canvasWrapper">
      <div class="notebook-container" id="editorCanvas"></div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
