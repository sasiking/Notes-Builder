  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-green: #4ade80;
      --accent-purple: #c084fc;
      --accent-yellow: #facc15;
      --accent-red: #f87171;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      padding-bottom: 60px;
    }

    /* HEADER */
    .hero-header {
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      border-bottom: 1px solid #334155;
      padding: 28px 24px 24px 24px;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
    }
    .hero-container {
      max-width: 1240px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .hero-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .brand-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-title span.badge {
      font-size: 11px;
      font-weight: 800;
      background: #0284c7;
      color: #ffffff;
      padding: 3px 8px;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn-header {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: all 0.15s ease;
    }
    .btn-new-note {
      background: #2563eb;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
    }
    .btn-new-note:hover { background: #1d4ed8; }

    .btn-scan-folder {
      background: #334155;
      color: #f8fafc;
      border: 1px solid #475569;
    }
    .btn-scan-folder:hover {
      background: #475569;
      color: #ffffff;
    }

    .btn-diary-quick {
      background: #0f766e;
      color: #ffffff;
      border: 1px solid #14b8a6;
      box-shadow: 0 4px 12px rgba(15, 118, 110, 0.35);
    }
    .btn-diary-quick:hover {
      background: #115e59;
      color: #ffffff;
    }

    /* CONTROLS */
    .controls-wrapper {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
    }
    .search-box-wrapper {
      position: relative;
      width: 100%;
    }
    .search-input {
      width: 100%;
      background: #0b1120;
      border: 1.5px solid #334155;
      color: #f8fafc;
      padding: 12px 18px 12px 42px;
      border-radius: 8px;
      font-size: 14.5px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .search-input:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.18);
    }
    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      font-size: 16px;
      pointer-events: none;
    }

    /* DYNAMIC FILTER TABS */
    .filter-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }
    .tab-btn {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .tab-btn:hover {
      background: #334155;
      color: #f8fafc;
    }
    .tab-btn.active {
      background: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
    }

    /* MAIN LIBRARY CONTAINER */
    .main-container {
      max-width: 1240px;
      margin: 28px auto 0 auto;
      padding: 0 20px;
    }

    .subject-section {
      margin-bottom: 36px;
    }
    .subject-title {
      font-size: 18.5px;
      font-weight: 800;
      color: #f1f5f9;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #334155;
      padding-bottom: 8px;
    }
    .subject-count {
      font-size: 12px;
      font-weight: 700;
      background: #334155;
      color: #94a3b8;
      padding: 2px 8px;
      border-radius: 9999px;
    }

    /* DYNAMIC NOTES GRID */
    .notes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 18px;
    }

    /* NOTE CARD */
    .note-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
      position: relative;
    }
    .note-card:hover {
      transform: translateY(-2px);
      border-color: #64748b;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }
    .note-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .note-badge {
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .note-meta {
      font-size: 11px;
      font-weight: 600;
      color: #64748b;
    }

    .note-title {
      font-size: 15.5px;
      font-weight: 700;
      color: #f8fafc;
      line-height: 1.35;
      margin-bottom: 6px;
    }
    .note-file-name {
      font-size: 12px;
      color: #64748b;
      font-family: monospace;
      margin-bottom: 16px;
      word-break: break-all;
    }

    /* ACTIONS */
    .note-actions {
      display: flex;
      gap: 8px;
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }
    .action-btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 700;
      padding: 8px 12px;
      border-radius: 5px;
      text-decoration: none;
      transition: all 0.15s ease;
      cursor: pointer;
    }
    .btn-read {
      background: #0284c7;
      color: #ffffff;
      border: 1px solid #38bdf8;
    }
    .btn-read:hover {
      background: #0369a1;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
    }
    .btn-direct {
      background: #334155;
      color: #cbd5e1;
      border: 1px solid #475569;
    }
    .btn-direct:hover {
      background: #475569;
      color: #ffffff;
    }
    .btn-edit {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
    }
    .btn-edit:hover {
      background: #334155;
      color: #f8fafc;
    }
    .btn-pdf {
      background: #7f1d1d;
      color: #ffffff;
      border: 1px solid #ef4444;
    }
    .btn-pdf:hover {
      background: #991b1b;
    }

    /* FULL-SCREEN IN-APP READER MODAL */
    .reader-modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100vw; height: 100vh;
      background: #0f172a;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .reader-modal-header {
      background: #1e293b;
      border-bottom: 2px solid #334155;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .reader-left-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .reader-btn-back {
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: background 0.15s ease;
    }
    .reader-btn-back:hover { background: #1d4ed8; }
    .reader-note-title {
      font-size: 14.5px;
      font-weight: 700;
      color: #f8fafc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .reader-right-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .reader-btn-direct {
      background: #334155;
      color: #38bdf8;
      border: 1px solid rgba(56,189,248,0.3);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .reader-btn-direct:hover { background: #475569; color: #ffffff; }
    .reader-btn-close {
      background: #ef4444;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }
    .reader-btn-close:hover { background: #dc2626; }
    .reader-iframe-container {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
    }
    .reader-iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
      display: block;
    }

    /* EMPTY SEARCH STATE */
    #emptyState {
      display: none;
      text-align: center;
      padding: 60px 20px;
      color: #64748b;
    }
    #emptyState h3 {
      font-size: 18px;
      color: #cbd5e1;
      margin-bottom: 6px;
    }

    @media (max-width: 768px) {
      .hero-top-row { flex-direction: column; align-items: stretch; }
      .notes-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 600px) {
      .hero-header { padding: 16px 12px 14px 12px; }
      .brand-title { font-size: 19px; }
      .btn-scan-folder { display: none !important; }
      .btn-new-note { display: none !important; }
      .btn-diary-quick { display: inline-flex !important; padding: 6px 12px !important; font-size: 12px !important; }
      .btn-edit { display: none !important; }
      .notes-grid { grid-template-columns: 1fr !important; gap: 12px !important; }
      .note-actions { display: grid !important; grid-template-columns: 1fr 1fr !important; gap: 8px !important; }
      .btn-read { grid-column: span 1 !important; padding: 10px 6px !important; font-size: 12px !important; text-align: center !important; justify-content: center !important; }
      .btn-direct { grid-column: span 1 !important; padding: 10px 6px !important; font-size: 12px !important; text-align: center !important; justify-content: center !important; }
      .btn-pdf { grid-column: span 2 !important; padding: 12px 14px !important; font-size: 13.5px !important; text-align: center !important; justify-content: center !important; }
      .tab-btn { white-space: nowrap !important; padding: 8px 12px !important; font-size: 12px !important; flex-shrink: 0 !important; }
      .filter-tabs { overflow-x: auto !important; -webkit-overflow-scrolling: touch !important; flex-wrap: nowrap !important; }
      .reader-modal-header { padding: 8px 10px; }
      .reader-note-title { max-width: 140px; font-size: 12.5px; }
    }
  </style>
</head>

  <!-- HEADER -->

    <div class="hero-container">
      <div class="hero-top-row">
        <h1 class="brand-title">
          📚 Group 1 Notes Hub
          <span class="badge" id="liveBadge">Dynamic Studio</span>
        </h1>
        <div class="top-actions">
          <a href="daily_aspirant_diary.html" class="btn-header btn-diary-quick" title="Open Daily Discipline Scorecard & Weight Tracker">
            📖 Daily Diary
          </a>
          <button class="btn-header btn-scan-folder" onclick="scanLocalFolderLive()" title="Pick folder on your PC to discover and render newly added notes live">
            📁 Scan Local Folder
          </button>
          <a href="../notes-builder-main/index.html" class="btn-header btn-new-note" target="_blank" title="Create new note in Visual Studio (Desktop)">
            ➕ New Blank Note
          </a>
        </div>
      </div>

      <div class="controls-wrapper">
        <div class="search-box-wrapper">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" class="search-input" placeholder="Search notes by topic, title, or filename..." oninput="handleSearch()">
        </div>

        <div class="filter-tabs" id="filterTabsContainer">
          <!-- Dynamically populated -->
        </div>
      </div>
    </div>
  </header>

  <!-- MAIN DYNAMIC CONTENT -->
  <main class="main-container">
    <div id="dynamicLibraryContainer">
      <!-- Dynamically populated based on notes present -->
    </div>

    <!-- EMPTY SEARCH MESSAGE -->
    <div id="emptyState">
      <h3>No study notes found</h3>
      <p>Try searching for a different keyword or reset the filter tab back to "All Notes".</p>
    </div>
  </main>

  <!-- FULL-SCREEN IN-APP READER MODAL -->
  <div id="noteReaderModal" class="reader-modal" style="display: none;">
    <div class="reader-modal-header">
      <div class="reader-left-actions">
        <button type="button" class="reader-btn-back" onclick="closeNoteReader()">⬅️ Back to Library</button>
        <span class="reader-note-title" id="readerNoteTitle">Study Note</span>
      </div>
      <div class="reader-right-actions">
        <a href="#" id="readerOpenExternal" class="reader-btn-direct" target="_self">↗️ Direct Page</a>
        <button type="button" class="reader-btn-close" onclick="closeNoteReader()" title="Close Reader">✖</button>
      </div>
    </div>
    <div class="reader-iframe-container">
      <iframe id="readerIframe" class="reader-iframe" src="about:blank"></iframe>
    </div>
  </div>

    // Guarantee window.NOTES_MANIFEST is populated immediately
    if (!window.NOTES_MANIFEST || !Array.isArray(window.NOTES_MANIFEST) || window.NOTES_MANIFEST.length === 0) {
      window.NOTES_MANIFEST = DEFAULT_NOTES_MANIFEST;
    }

    let activeFilter = 'all';

    // Subject styling and icons mapping
    const subjectThemes = {
      'polity': { icon: '🏛️', label: 'Polity & Governance', badgeClass: 'background:rgba(56,189,248,0.15); color:#38bdf8; border:1px solid rgba(56,189,248,0.3);' },
      'economy': { icon: '📈', label: 'Economy & Development', badgeClass: 'background:rgba(74,222,128,0.15); color:#4ade80; border:1px solid rgba(74,222,128,0.3);' },
      'history': { icon: '📜', label: 'Ancient & Medieval History', badgeClass: 'background:rgba(250,204,21,0.15); color:#facc15; border:1px solid rgba(250,204,21,0.3);' },
      'science': { icon: '🚀', label: 'Science & Technology', badgeClass: 'background:rgba(192,132,252,0.15); color:#c084fc; border:1px solid rgba(192,132,252,0.3);' },
      'tech': { icon: '🚀', label: 'Science & Technology', badgeClass: 'background:rgba(192,132,252,0.15); color:#c084fc; border:1px solid rgba(192,132,252,0.3);' },
      'time': { icon: '⏱️', label: 'Study Timetables & Schedules', badgeClass: 'background:rgba(249,115,22,0.15); color:#f97316; border:1px solid rgba(249,115,22,0.3);' },
      'table': { icon: '⏱️', label: 'Study Timetables & Schedules', badgeClass: 'background:rgba(249,115,22,0.15); color:#f97316; border:1px solid rgba(249,115,22,0.3);' },
      'general': { icon: '📁', label: 'General Notes', badgeClass: 'background:rgba(148,163,184,0.15); color:#94a3b8; border:1px solid rgba(148,163,184,0.3);' }
    };

    function resolveThemeForFolder(folderName) {
      const lower = folderName.toLowerCase();
      for (const [key, theme] of Object.entries(subjectThemes)) {
        if (lower.includes(key)) return theme;
      }
      const formattedLabel = folderName.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
      return { icon: '📁', label: formattedLabel, badgeClass: 'background:rgba(148,163,184,0.15); color:#94a3b8; border:1px solid rgba(148,163,184,0.3);' };
    }

    function formatFileSize(bytes) {
      if (!bytes || bytes === 0) return '';
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    function getMergedManifest(sourceManifest) {
      const list = (sourceManifest && sourceManifest.length) ? sourceManifest : (window.NOTES_MANIFEST && window.NOTES_MANIFEST.length ? window.NOTES_MANIFEST : DEFAULT_NOTES_MANIFEST);
      if (!list || !Array.isArray(list)) return [];
      let overrides = {};
      try {
        overrides = JSON.parse(localStorage.getItem('GROUP1_NOTES_TITLE_OVERRIDES') || '{}');
      } catch (e) {}

      return list.map(note => {
        const override = overrides[note.name];
        if (override && override.title) {
          return { ...note, title: override.title };
        }
        return note;
      });
    }

    // MAIN DYNAMIC RENDERER
    function renderDynamicDashboard(manifest) {
      const activeManifest = (manifest && manifest.length) ? manifest : (window.NOTES_MANIFEST && window.NOTES_MANIFEST.length ? window.NOTES_MANIFEST : DEFAULT_NOTES_MANIFEST);
      const container = document.getElementById('dynamicLibraryContainer');
      const tabsContainer = document.getElementById('filterTabsContainer');
      if (!container || !activeManifest) return;

      const mergedList = getMergedManifest(manifest);

      container.innerHTML = '';
      tabsContainer.innerHTML = '';

      // 1. Group notes dynamically by folder
      const groups = {};
      mergedList.forEach(note => {
        const folder = note.folder || 'General';
        if (!groups[folder]) groups[folder] = [];
        groups[folder].push(note);
      });

      // 2. Build Filter Tabs
      const allTab = document.createElement('button');
      allTab.className = 'tab-btn active';
      allTab.innerText = `All Notes (${mergedList.length})`;
      allTab.onclick = () => setFilter('all', allTab);
      tabsContainer.appendChild(allTab);

      Object.keys(groups).forEach(folder => {
        const theme = resolveThemeForFolder(folder);
        const tab = document.createElement('button');
        tab.className = 'tab-btn';
        tab.innerText = `${theme.icon} ${folder.replace(/_/g, ' ')} (${groups[folder].length})`;
        tab.onclick = () => setFilter(folder, tab);
        tabsContainer.appendChild(tab);
      });

      // 3. Build Subject Sections & Cards
      Object.entries(groups).forEach(([folder, notes]) => {
        const theme = resolveThemeForFolder(folder);

        const section = document.createElement('section');
        section.className = 'subject-section';
        section.setAttribute('data-folder', folder);

        section.innerHTML = `
          <h2 class="subject-title">
            ${theme.icon} ${theme.label}
            <span class="subject-count">${notes.length} ${notes.length === 1 ? 'Item' : 'Items'}</span>
          </h2>
          <div class="notes-grid"></div>
        `;

        const grid = section.querySelector('.notes-grid');

        notes.forEach(note => {
          const card = document.createElement('div');
          card.className = 'note-card';
          card.setAttribute('data-folder', folder);
          card.setAttribute('data-keywords', `${note.name} ${note.title} ${folder}`.toLowerCase());

          const sizeFormatted = formatFileSize(note.size);
          const isPdf = note.type === 'pdf';

          card.innerHTML = `
            <div>
              <div class="note-card-header">
                <span class="note-badge" style="${isPdf ? 'background:rgba(248,113,113,0.15); color:#f87171; border:1px solid rgba(248,113,113,0.3);' : theme.badgeClass}">
                  ${isPdf ? '📄 PDF' : '📝 HTML'}
                </span>
                <span class="note-meta">${sizeFormatted}</span>
              </div>
              <h3 class="note-title">${note.title}</h3>
              <div class="note-file-name">📄 ${note.name}</div>
            </div>
            <div class="note-actions">
              ${isPdf ? `
                <a href="${note.path}" target="_self" class="action-btn btn-pdf">
                  📄 Open PDF
                </a>
              ` : `
                <button type="button" onclick="openNoteReader('${note.path}', '${note.title.replace(/'/g, "\\'")}')" class="action-btn btn-read">
                  👁️ Read in App
                </button>
                <a href="${note.path}" target="_self" class="action-btn btn-direct" title="Open full note page directly">
                  ↗️ Direct
                </a>
              `}
              ${!isPdf ? (note.name === 'daily_aspirant_diary.html' ? `
                <a href="${note.path}" target="_self" class="action-btn" style="background:#0f766e; border-color:#14b8a6; color:#ffffff;" title="Open full Diary Tracker">
                  📓 Tracker
                </a>
                <a href="../notes-builder-main/index.html?note=../Group-1-Notes/${note.path}" target="_blank" class="action-btn btn-edit" title="Open in Visual Builder">
                  ✏️ In Builder
                </a>
              ` : `
                <a href="../notes-builder-main/index.html?note=../Group-1-Notes/${note.path}" target="_blank" class="action-btn btn-edit">
                  ✏️ Edit in Builder
                </a>
              `) : ''}
            </div>
          `;

          grid.appendChild(card);
        });

        container.appendChild(section);
      });

      handleSearch();
    }

    // SEARCH & FILTER LOGIC
    function setFilter(folder, btn) {
      activeFilter = folder;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      handleSearch();
    }

    function handleSearch() {
      const query = (document.getElementById('searchInput')?.value || '').trim().toLowerCase();
      const sections = document.querySelectorAll('.subject-section');
      let totalVisible = 0;

      sections.forEach(sec => {
        const secFolder = sec.getAttribute('data-folder');
        const matchesFilter = (activeFilter === 'all' || activeFilter === secFolder);
        const cards = sec.querySelectorAll('.note-card');
        let secVisibleCount = 0;

        cards.forEach(card => {
          const keywords = card.getAttribute('data-keywords') || '';
          const matchesQuery = !query || keywords.includes(query);
          const shouldShow = matchesFilter && matchesQuery;

          if (shouldShow) {
            card.style.display = 'flex';
            secVisibleCount++;
            totalVisible++;
          } else {
            card.style.display = 'none';
          }
        });

        sec.style.display = secVisibleCount > 0 ? 'block' : 'none';
      });

      const emptyState = document.getElementById('emptyState');
      if (emptyState) {
        emptyState.style.display = totalVisible === 0 ? 'block' : 'none';
      }
    }

    function extractBestNoteTitle(html, filename) {
      function cleanText(txt) {
        if (!txt) return '';
        const temp = document.createElement('div');
        temp.innerHTML = txt;
        return temp.textContent.trim().replace(/\s+/g, ' ');
      }
      function isGeneric(t) {
        if (!t) return true;
        const s = t.toLowerCase().trim();
        return (
          s === 'polity notes output' ||
          s === 'visual notes studio' ||
          s.includes('visual build') ||
          s === 'study notes' ||
          s === 'untitled' ||
          s === 'document'
        );
      }
      const titleMatch = html.match(/<title>([^<]*)<\/title>/i);
      const rawTitle = titleMatch ? cleanText(titleMatch[1]) : '';
      const h1Match = html.match(/<h1[^>]*>([\s\S]*?)<\/h1>/i);
      const rawH1 = h1Match ? cleanText(h1Match[1]) : '';

      if (rawTitle && !isGeneric(rawTitle)) return rawTitle;
      if (rawH1 && !isGeneric(rawH1)) return rawH1;
      return filename.replace(/\.[^/.]+$/, '').replace(/_/g, ' ');
    }

    // LIVE LOCAL FOLDER SCANNER (Scans files directly on disk via modern File System API on Desktop)
    async function scanLocalFolderLive() {
      if (!('showDirectoryPicker' in window)) {
        alert('✨ All 23 study notes, timetable & daily diary are already pre-loaded into your dashboard!\n\n(Note: Live folder scanning is an optional desktop utility in Chrome/Edge on laptop/PC for auto-discovering new files).');
        return;
      }
      try {
        const dirHandle = await window.showDirectoryPicker();
        const liveManifest = [];

        async function scanDir(handle, relPath = '') {
          for await (const entry of handle.values()) {
            if (entry.kind === 'directory') {
              if (entry.name === 'vedic_age_updated_files') continue;
              await scanDir(entry, relPath ? `${relPath}/${entry.name}` : entry.name);
            } else if (entry.kind === 'file') {
              const name = entry.name;
              if (name === 'index.html' || name === 'Dashboard.html' || name === 'notes-data.js' || name === 'css2') continue;
              const ext = name.split('.').pop().toLowerCase();
              const fullRelPath = relPath ? `${relPath}/${name}` : name;

              if (ext === 'html' || ext === 'htm') {
                const file = await entry.getFile();
                const text = await file.text();
                const title = extractBestNoteTitle(text, name);

                liveManifest.push({
                  folder: relPath || 'General',
                  name: name,
                  path: fullRelPath,
                  title: title,
                  type: 'html',
                  size: file.size
                });

                if (window.NOTES_DATABASE) {
                  window.NOTES_DATABASE[name] = text;
                }
              } else if (ext === 'pdf') {
                const file = await entry.getFile();
                liveManifest.push({
                  folder: relPath || 'General',
                  name: name,
                  path: fullRelPath,
                  title: name.replace(/\.[^/.]+$/, '').replace(/_/g, ' ') + ' (PDF)',
                  type: 'pdf',
                  size: file.size
                });
              }
            }
          }
        }

        await scanDir(dirHandle);

        if (liveManifest.length > 0) {
          window.NOTES_MANIFEST = liveManifest;
          renderDynamicDashboard(liveManifest);
          const badge = document.getElementById('liveBadge');
          if (badge) {
            badge.innerText = `Live: ${dirHandle.name} (${liveManifest.length})`;
            badge.style.background = '#059669';
          }
        }
      } catch (err) {
        if (err.name !== 'AbortError') {
          console.error(err);
          alert('Could not scan folder.');
        }
      }
    }

    // INITIALIZE ON LOAD & DYNAMIC SYNC LISTENERS
    window.refreshNoteTitle = function(fileName, newTitle) {
      if (!fileName || !newTitle) return;
      try {
        const overrides = JSON.parse(localStorage.getItem('GROUP1_NOTES_TITLE_OVERRIDES') || '{}');
        overrides[fileName] = { title: newTitle, updatedAt: Date.now() };
        localStorage.setItem('GROUP1_NOTES_TITLE_OVERRIDES', JSON.stringify(overrides));
      } catch (e) {}
      renderDynamicDashboard();
    };

    // Auto-update dashboard when title is changed in builder in another tab
    window.addEventListener('storage', (e) => {
      if (e.key === 'GROUP1_NOTES_TITLE_OVERRIDES') {
        renderDynamicDashboard();
      }
    });

    // Auto-refresh when user clicks back to the dashboard tab
    window.addEventListener('focus', () => {
      renderDynamicDashboard();
    });

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        renderDynamicDashboard();
      }
    });

    // IN-APP READER HANDLERS (Enables seamless zero-tab reading inside PWA)
    function openNoteReader(notePath, noteTitle) {
      const modal = document.getElementById('noteReaderModal');
      const iframe = document.getElementById('readerIframe');
      const titleSpan = document.getElementById('readerNoteTitle');
      const directLink = document.getElementById('readerOpenExternal');

      if (!modal || !iframe) {
        window.location.href = notePath;
        return;
      }

      titleSpan.innerText = noteTitle || 'Study Note';
      iframe.src = notePath;
      directLink.href = notePath;
      modal.style.display = 'flex';
      document.body.style.overflow = 'hidden';
    }

    function closeNoteReader() {
      const modal = document.getElementById('noteReaderModal');
      const iframe = document.getElementById('readerIframe');
      if (modal) modal.style.display = 'none';
      if (iframe) iframe.src = 'about:blank';
      document.body.style.overflow = '';
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeNoteReader();
    });

    document.addEventListener('DOMContentLoaded', () => {
      renderDynamicDashboard();
    });
  </script>
</body>
